name: CI

# E-CI — Gate CI de ticket-generator-service sur le patron prouvé (core/payment/
# auth/notification) : la suite UNITAIRE tourne en vert et devient un gate sur
# chaque PR/poussée vers main. Les tests d'intégration (tests/integration) seront
# ajoutés plus tard en job dédié, pour garder ce gate FIABLE et VERT.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      - name: Tests unitaires
        run: npm run test:unit
        env:
          NODE_ENV: test
          CI: "true"
